name: Event-Driven Market Research Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Facebook Group URL to analyze'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger-scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers and System Dependencies
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run Scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        TARGET_URL: ${{ github.event.inputs.target_url || github.event.client_payload.target_url || secrets.TARGET_URL }}
      run: |
        python app.py
